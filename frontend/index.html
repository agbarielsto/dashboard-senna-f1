<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayrton Senna | Data Analytics Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Segoe+UI:wght@300;400;600;700&display=swap');

        body {
            background-color: #121212; 
            color: #ffffff;
            font-family: 'Segoe UI', 'Roboto', sans-serif; 
            margin: 0;
            padding: 30px;
        }

        /* --- CABEÇALHO --- */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333333;
        }

        .header-text {
            text-align: left;
        }

        h1 {
            font-family: 'Racing Sans One', sans-serif;
            color: #e10600; 
            font-size: 3.5em;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #a0a0a0;
            margin-top: 2px;
            font-size: 1.1em;
            font-weight: 300;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #333333;
        }

        /* --- ESTILO POWER BI PARA OS CARTÕES --- */
        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; 
            margin-bottom: 30px;
        }

        .kpi-card {
            background-color: #252525; 
            border: 1px solid #333333; 
            border-left: 4px solid #e10600; 
            border-radius: 4px; 
            padding: 20px 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .kpi-title {
            font-size: 0.9em;
            color: #b3b3b3;
            margin-bottom: 8px;
            font-weight: 400;
        }

        .kpi-value {
            font-size: 2.6em;
            font-weight: 600; 
            color: #ffffff;
            margin: 0;
            line-height: 1;
        }

        /* --- ÁREA DE GRÁFICOS --- */
        .charts-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .chart-card {
            background-color: #252525;
            border: 1px solid #333333;
            border-radius: 4px;
            padding: 20px;
            flex: 1;
            min-width: 320px;
            max-width: 600px;
        }

        .chart-title {
            text-align: left; 
            color: #e0e0e0;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: 600;
        }

        .loading { color: #e10600; font-size: 0.4em; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <!-- AQUI FOI FEITA A TROCA DO LINK PELA SUA IMAGEM LOCAL -->
        <img src="file:///C:/Users/insta/Downloads/projeto%20senna/Ayrton-senna-marcas.webp.webp" alt="Ayrton Senna" class="profile-img">
        <div class="header-text">
            <h1>Ayrton Senna</h1>
            <div class="subtitle">Análise Histórica de Performance (1984 - 1994)</div>
        </div>
    </header>

    <!-- Grid de 6 KPIs Padrão Power BI -->
    <div class="kpi-container">
        <div class="kpi-card">
            <div class="kpi-title">Corridas Disputadas</div>
            <div class="kpi-value" id="kpi-total"><span class="loading">...</span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Vitórias Totais</div>
            <div class="kpi-value" id="kpi-vitorias"><span class="loading">...</span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Chegadas no Pódio</div>
            <div class="kpi-value" id="kpi-podios"><span class="loading">...</span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Pole Positions</div>
            <div class="kpi-value" id="kpi-poles"><span class="loading">...</span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Pole to Win</div>
            <div class="kpi-value" id="kpi-pole-win"><span class="loading">...</span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Corridas de Recuperação</div>
            <div class="kpi-value" id="kpi-recuperacao"><span class="loading">...</span></div>
        </div>
    </div>

    <!-- Gráficos -->
    <div class="charts-container">
        <div class="chart-card">
            <div class="chart-title">Evolução de Pontos por Temporada</div>
            <canvas id="graficoLinha"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-title">Top 5 Circuitos Vencedores</div>
            <canvas id="graficoBarra"></canvas>
        </div>
    </div>

    <script>
        async function carregarKPIs() {
            try {
                const resposta = await fetch('http://127.0.0.1:5000/api/kpis');
                const json = await resposta.json();
                if (json.status === "sucesso") {
                    document.getElementById('kpi-total').innerText = json.dados.total_corridas;
                    document.getElementById('kpi-vitorias').innerText = json.dados.vitorias;
                    document.getElementById('kpi-podios').innerText = json.dados.podios;
                    document.getElementById('kpi-poles').innerText = json.dados.poles;
                    document.getElementById('kpi-pole-win').innerText = json.dados.pole_to_win;
                    document.getElementById('kpi-recuperacao').innerText = json.dados.corridas_recuperacao;
                }
            } catch (erro) { console.error("Falha:", erro); }
        }

        async function carregarGraficos() {
            try {
                const resposta = await fetch('http://127.0.0.1:5000/api/graficos');
                const json = await resposta.json();

                if (json.status === "sucesso") {
                    const ctxLinha = document.getElementById('graficoLinha').getContext('2d');
                    new Chart(ctxLinha, {
                        type: 'line',
                        data: {
                            labels: json.grafico_linha.labels,
                            datasets: [{
                                label: 'Pontos',
                                data: json.grafico_linha.dados,
                                borderColor: '#e10600',
                                backgroundColor: 'rgba(225, 6, 0, 0.15)',
                                borderWidth: 3,
                                pointBackgroundColor: '#252525',
                                pointBorderColor: '#e10600',
                                pointRadius: 5,
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { color: '#a0a0a0' }, grid: { color: '#333333' } },
                                y: { ticks: { color: '#a0a0a0' }, grid: { color: '#333333' } }
                            }
                        }
                    });

                    const ctxBarra = document.getElementById('graficoBarra').getContext('2d');
                    new Chart(ctxBarra, {
                        type: 'bar',
                        data: {
                            labels: json.grafico_barra.labels,
                            datasets: [{
                                label: 'Vitórias',
                                data: json.grafico_barra.dados,
                                backgroundColor: '#e10600',
                                borderRadius: 2
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { ticks: { color: '#a0a0a0', stepSize: 1 }, grid: { color: '#333333' } },
                                y: { ticks: { color: '#a0a0a0' }, grid: { display: false } }
                            }
                        }
                    });
                }
            } catch (erro) { console.error("Falha:", erro); }
        }

        carregarKPIs();
        carregarGraficos();
    </script>
</body>
</html>
